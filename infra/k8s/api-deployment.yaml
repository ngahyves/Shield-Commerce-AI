# --- API Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: rickyr7/shieldcommerce-api:latest
          imagePullPolicy: Always
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
          ports:
            - containerPort: 8001
          env:
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
            - {name: QDRANT_HOST, value: "qdrant"}
            - {name: QDRANT_PORT, value: "6333"}
            - {name: QDRANT_GRPC_PORT, value: "6334"}
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef: {name: app-secrets, key: GROQ_API_KEY}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: app-secrets, key: GEMINI_API_KEY}
          volumeMounts:
            - name: api-data
              mountPath: /app/data
              readOnly: true
          resources:
            requests: {memory: "1Gi", cpu: "200m"}
            limits:   {memory: "3Gi", cpu: "1000m"}
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: api-data-pvc
---
# --- API Service ---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector: {app: api}
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30080
      name: http
---
# --- Redis Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: {memory: "64Mi", cpu: "50m"}
            limits:   {memory: "256Mi", cpu: "200m"}
---
# --- Redis Service ---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports:
    - port: 6379
      targetPort: 6379
---
# --- Qdrant Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
spec:
  replicas: 1
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant}
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          resources:
            requests: {memory: "256Mi", cpu: "100m"}
            limits:   {memory: "1Gi",  cpu: "500m"}
---
# --- Qdrant Service ---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector: {app: qdrant}
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc